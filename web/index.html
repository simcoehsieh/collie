<!doctype html>
<!-- No theme class here: `color-scheme: light dark` in index.css follows the OS, and
     public/theme-init.js stamps `light`/`dark` before first paint only when the user has pinned
     one. The cascade decides, not the markup. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- NO `viewport-fit=cover`, and that is the fix for the letterbox — see index.css for the
         measurements. With cover, iOS 26 gave this app two answers at once: a layout viewport of 793
         on an 852pt screen (already 852 minus a status bar, i.e. sized for an INSET web view) while
         still placing the page under the status bar and reporting env(safe-area-inset-top) 59. The
         59pt difference was letterboxed in page colour above the home indicator, and no CSS reaches
         it — a shell stretched to cover it put the composer off the bottom of the screen instead.
         Without cover the web view is simply inset to the safe area: every env() goes to 0, the OS
         paints the status-bar and home-indicator bands itself, and the page's own box is the whole
         of what it is given. The chrome does not move — the header's 59pt of inset-top is replaced
         by the OS's own band of exactly the same height.
         `interactive-widget=resizes-content` stays: it is what makes `dvh` shrink with the soft
         keyboard, which is what holds the composer above it (hooks/use-keyboard.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <!-- Blocking, and first: the pin class must be on <html> before anything paints. Same-origin,
         so `script-src 'self'` already allows it. -->
    <script src="/theme-init.js"></script>
    <!-- Browser chrome follows the OS for System users. useTheme rewrites these at runtime for
         someone who has pinned the opposite of their OS.
         THESE ARE --background RASTERISED, and they have to be: in standalone the OS paints the
         status-bar band in `theme-color` and the app paints the header underneath it, so any
         other value is a permanent one-shade stripe across the top of every screen. They shipped
         as #f5f5f5 / #0a0a0a, which are the MIRROR's two grounds (components/mirror-space.ts) —
         right for the terminal, one step off the page. `oklch(0.965 0.005 255)` rasterises to
         #f1f4f7 and `oklch(0.17 0.012 262)` to #0d0f15, measured in the browser at DPR 1.
         KEEP THESE THREE IN STEP: index.css `--background`, hooks/use-theme.ts META_COLOR (the
         same two values, for the pinned case), and vite.config.ts's manifest colours. Each of
         those points back here. -->
    <meta
      name="theme-color"
      content="#f1f4f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d0f15"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default`, NOT `black-translucent`, and the reason is measured. Under black-translucent on
         iOS 26 this app was given a layout viewport of 793 on an 852pt screen — already sized for an
         OPAQUE status bar (852 − 59) — while the web view was still placed under the status bar and
         `env(safe-area-inset-top)` still reported 59. The page therefore ended 59pt above the bottom
         of the screen and iOS letterboxed the difference in page colour, which no CSS can fill: a
         shell stretched to 852 put the composer off the bottom of the screen instead (index.css says
         the same from the other side). `default` asks for the placement the viewport was already
         being sized for. The header loses its 59pt of inset-top and the status bar becomes the OS's
         to paint, so the chrome lands in the same place it always did. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Collie" />
    <title>Collie</title>
    <!-- The UI typeface, fetched in parallel with the CSS that asks for it rather than after it.
         index.css already guarantees no layout shift with a metric-matched fallback, so this is not
         load-bearing — it just means the swap usually never happens at all. `crossorigin` is
         MANDATORY on a font preload even same-origin (fonts are fetched in CORS mode); without it
         the browser fetches the file twice. ONLY THE DEFAULT FACE is preloaded — the other shipped
         face is a deliberate choice a reader made, and preloading a file most devices never render
         would spend everyone's first paint on a minority. Keep the URL in step with
         DEFAULT_UI_FONT_URL in src/lib/sw-routes.ts and the @font-face in src/index.css —
         fonts.test.ts pins all three. -->
    <!-- FORK: the default face is the system one, so there is nothing to preload — the two shipped
         webfonts are opt-in and fetched when a reader picks one. -->
    <!-- The web manifest <link> is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- First-paint splash: the mark shown the instant the PWA opens, bridging the OS launch splash
         and React mount (createRoot replaces #root, so it clears itself). Critical CSS is inlined
         here so it paints before the app bundle/index.css load — pure CSS, no JS. It mirrors
         routes/root.tsx's BootSplash (same mark, 4rem, copy) so the hand-off is seamless.
         FORK: the mark is the cat over a terminal (components/meow-mark.tsx), drawn here as a CSS
         mask so it takes the splash's own text colour in either theme; upstream's galloping-dog
         sprite (dog-gallop.png) is no longer used here. The class name is kept so the markup below
         and any selector upstream adds keep matching. -->
    <style>
      /* index.css has not loaded at this point, so the splash declares `color-scheme` itself —
         otherwise light-dark() below has nothing to resolve against and every value falls to its
         light branch. These three rules mirror index.css exactly; keep them in step. */
      :root {
        color-scheme: light dark;
      }
      :root.light {
        color-scheme: light;
      }
      :root.dark {
        color-scheme: dark;
      }
      /* The UI typefaces, declared a second time. index.css has not loaded here either, and the
         splash's caption is the same string at the same size as routes/root.tsx's BootSplash — so
         if the splash painted in the system face and React's copy painted in the chosen one, the
         hand-off would change the family and the line under the operator's eyes. Same faces, same
         stand-ins, same overrides; keep them in step with index.css. The default file is preloaded
         above, so for most devices this costs no extra request. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/ui-space-grotesk-2.000-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Grotesk Fallback";
        src:
          local("Arial"), local("Helvetica Neue"), local("Helvetica"),
          local("Liberation Sans"), local("Arimo"), local("Roboto");
        size-adjust: 107.53%;
        ascent-override: 91.51%;
        descent-override: 27.16%;
        line-gap-override: 0%;
      }
      /* Aldrich is the DEFAULT face now, so this is the block the preload above warms — the
         splash and React's first paint resolve to it on any device that never opened the setting.
         One weight; the synthesized bold is index.css's note. Space Grotesk above it stays on the
         same terms it always had, but the roles flipped: theme-init.js has already put
         `font-grotesk` on <html> for a reader who chose it, and that face now costs its own fetch
         while Aldrich rides the preload. Keep in step with index.css. */
      @font-face {
        font-family: "Aldrich";
        src: url("/fonts/ui-aldrich-1.002-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Aldrich Fallback";
        src:
          local("Arial"), local("Helvetica Neue"), local("Helvetica"),
          local("Liberation Sans"), local("Arimo"), local("Roboto");
        size-adjust: 113.37%;
        ascent-override: 63.53%;
        descent-override: 18.52%;
        line-gap-override: 4.22%;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        /* --background / --muted-foreground rasterized, because index.css has not loaded yet:
           oklch(0.97)/oklch(0.48) light, oklch(0.145)/oklch(0.708) dark. The light pair used to be
           #ffffff/#8a8a8a, which is neither token — the page stepped from white to rgb(245) on
           hand-off to React, and the caption sat at 3.45:1. Keep in step with index.css. */
        background: light-dark(#f5f5f5, #0a0a0a);
        color: light-dark(#5d5d5d, #a1a1a1);
        font:
          500 0.875rem/1.4 var(--font-sans);
      }
      /* The typeface setting, mirrored from index.css (ADR 0033). The splash resolves --font-sans
         like everything else does, so the same three blocks decide the same thing here — otherwise
         a reader on Aldrich would get a Space Grotesk splash and a change of voice on hand-off,
         which is the exact failure the block above this one exists to prevent. `font-operator` is
         NOT mirrored: an operator face has no pre-paint path (theme-init.js says why), so it
         resolves through the default below, which is what it should do. Keep in step with
         index.css. */
      :root {
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      :root.font-aldrich {
        --font-sans:
          "Aldrich", "Aldrich Fallback", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      :root.font-system {
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      :root.font-grotesk {
        --font-sans:
          "Space Grotesk", "Space Grotesk Fallback", ui-sans-serif, system-ui,
          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .boot-splash__dog {
        --dog-size: 4rem;
        width: var(--dog-size);
        height: var(--dog-size);
        /* The drawing is the mask, the colour is the text's: no sprite, no second colour to keep
           in step with the theme, and the window's interior is the page showing through. Static —
           the cursor blinks once React's mark takes over, and a still frame needs no reduced-motion
           branch. */
        background-color: currentColor;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='18 18 144 144'><polygon points='52,60 60,22 84,54'/><polygon points='128,60 120,22 96,54'/><path fill-rule='evenodd' d='M56,70 a34,26 0 0 1 68,0 Z M69,62 a5,7 0 1 0 10,0 a5,7 0 1 0 -10,0 Z M101,62 a5,7 0 1 0 10,0 a5,7 0 1 0 -10,0 Z'/><rect x='24' y='66' width='132' height='92' rx='14' fill='none' stroke='black' stroke-width='9'/><path d='M46,98 l14,12 l-14,12' fill='none' stroke='black' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><rect x='72' y='97' width='12' height='27' rx='2'/></svg>") no-repeat center / contain;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='18 18 144 144'><polygon points='52,60 60,22 84,54'/><polygon points='128,60 120,22 96,54'/><path fill-rule='evenodd' d='M56,70 a34,26 0 0 1 68,0 Z M69,62 a5,7 0 1 0 10,0 a5,7 0 1 0 -10,0 Z M101,62 a5,7 0 1 0 10,0 a5,7 0 1 0 -10,0 Z'/><rect x='24' y='66' width='132' height='92' rx='14' fill='none' stroke='black' stroke-width='9'/><path d='M46,98 l14,12 l-14,12' fill='none' stroke='black' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/><rect x='72' y='97' width='12' height='27' rx='2'/></svg>") no-repeat center / contain;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading Collie">
        <span class="boot-splash__dog" aria-hidden="true"></span>
        <span>Connecting to the herd…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
